[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
gas_reports = ["ZethosVault"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000

[rpc_endpoints]
hsk_mainnet = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[etherscan]
hsk_mainnet = { key = "", chain = 177, url = "https://hsk.blockscout.com/api/" }
hsk_testnet = { key = "", chain = 133, url = "https://testnet-explorer.hsk.xyz/api/" }

[dependencies]
openzeppelin-contracts = { version = "5.7.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.7.0" }
forge-std = { version = "1.9.7", git = "https://github.com/foundry-rs/forge-std.git", tag = "v1.9.7" }

[soldeer]
remappings_generate = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
sort_imports = true
number_underscore = "thousands"
