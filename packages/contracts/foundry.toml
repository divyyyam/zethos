[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
hsk_mainnet = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[etherscan]
hsk_mainnet = { key = "", chain = 177, url = "https://hsk.blockscout.com/api/" }
hsk_testnet = { key = "", chain = 133, url = "https://testnet-explorer.hsk.xyz/api/" }

[dependencies]
openzeppelin-contracts = { version = "5.7.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.7.0" }

[soldeer]
remappings_generate = false

[fmt]
line_length = 100
